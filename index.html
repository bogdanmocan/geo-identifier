<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geo-identifier</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      background: #fff;
      color: #111;
    }
    button {
      font: inherit;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #888;
      background: #f2f2f2;
      color: #111;
    }
    #status, #result, #coords { margin-top: 12px; line-height: 1.4; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      button { background: #222; color: #eee; border-color: #555; }
    }
  </style>
</head>
<body>
  <h1>geo-identifier</h1>
  <button id="locate" type="button">Detect my location</button>
  <p id="status">Press the button to read your location once.</p>
  <p id="coords"></p>
  <p id="result"></p>
  <script src="app.js"></script>
</body>
</html>
